<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" role="img" aria-label="Avatar placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <rect width="4" height="1" y="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="112" height="112" fill="url(#bg)"/>
  <rect width="112" height="112" fill="url(#scan)"/>

  <!-- corner ticks -->
  <g stroke="#ff2323" stroke-width="2" fill="none" opacity="0.9">
    <path d="M6 6 H20 M6 6 V20"/>
    <path d="M106 6 H92 M106 6 V20"/>
    <path d="M6 106 H20 M6 106 V92"/>
    <path d="M106 106 H92 M106 106 V92"/>
  </g>

  <!-- glitch face: two eyes + visor -->
  <g>
    <rect x="34" y="44" width="44" height="8" fill="#ededee" opacity="0.9"/>
    <rect x="38" y="44" width="10" height="8" fill="#ff2323"/>
    <rect x="64" y="44" width="10" height="8" fill="#ff2323"/>
    <rect x="44" y="62" width="24" height="4" fill="#5a5e64"/>
    <rect x="48" y="70" width="16" height="2" fill="#8a8d92" opacity="0.7"/>
  </g>

  <!-- shifted red glitch echo -->
  <g fill="#ff2323" opacity="0.35" transform="translate(2 0)">
    <rect x="38" y="44" width="10" height="8"/>
    <rect x="64" y="44" width="10" height="8"/>
  </g>
  <g fill="#00e5ff" opacity="0.25" transform="translate(-2 0)">
    <rect x="38" y="44" width="10" height="8"/>
    <rect x="64" y="44" width="10" height="8"/>
  </g>

  <!-- bottom caption -->
  <text x="56" y="98" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="8" fill="#5a5e64" letter-spacing="2">NO SIGNAL</text>
</svg>
