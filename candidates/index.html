<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>avatar candidates</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #000; color: #cbcbcb; font-family: "Share Tech Mono", monospace; padding: 2rem 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; color: #ededee; letter-spacing: 0.1em; }
  p.sub { margin: 0 0 2rem; color: #5a5e64; font-size: 0.75rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
  .card { text-align: center; }
  .card .frame { display: flex; align-items: center; justify-content: center; height: 320px; background: #0a0a0a; border: 1px solid #ff2323; padding: 1rem; }
  .card .frame img { display: block; max-height: 100%; max-width: 100%; image-rendering: pixelated; }
  .card .name { margin-top: 0.75rem; font-size: 0.8rem; color: #ff2323; letter-spacing: 0.05em; }
  .card .src { margin-top: 0.25rem; font-size: 0.7rem; color: #5a5e64; }
  .card .big { transform: scale(2); image-rendering: pixelated; }
</style>
</head>
<body>
  <h1>// avatar custom — pixel art</h1>
  <p class="sub">coder + terminal + smoke · CC0 (original, made with python)</p>
  <div class="grid">
    <div class="card">
      <div class="frame"><img src="avatar-custom.gif" alt="avatar custom" /></div>
      <div class="name">avatar-custom.gif</div>
      <div class="src">128x128 · 12 frames · custom</div>
    </div>
    <div class="card">
      <div class="frame"><img src="cat-kitty.gif" alt="cat kitty" /></div>
      <div class="name">cat-kitty.gif (fallback)</div>
      <div class="src">kitty · kotnaszynce</div>
    </div>
  </div>
</body>
</html>
