<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>avatar candidates</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #000; color: #cbcbcb; font-family: "Share Tech Mono", monospace; padding: 2rem 1rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; color: #ededee; letter-spacing: 0.1em; }
  p.sub { margin: 0 0 2rem; color: #5a5e64; font-size: 0.75rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
  .card { text-align: center; }
  .card .frame { display: flex; align-items: center; justify-content: center; height: 280px; background: #0a0a0a; border: 1px solid #1e1e22; padding: 1rem; }
  .card .frame img { display: block; max-height: 100%; max-width: 100%; image-rendering: pixelated; }
  .card .name { margin-top: 0.75rem; font-size: 0.8rem; color: #cbcbcb; letter-spacing: 0.05em; }
  .card .src { margin-top: 0.25rem; font-size: 0.7rem; color: #5a5e64; }
</style>
</head>
<body>
  <h1>// avatar candidates — round 2</h1>
  <p class="sub">tutti CC0 (public domain) — pick one</p>
  <div class="grid">
    <div class="card">
      <div class="frame"><img src="robot-idle.gif" alt="robot idle" /></div>
      <div class="name">robot-idle.gif</div>
      <div class="src">Pixel Robot · David Harrington</div>
    </div>
    <div class="card">
      <div class="frame"><img src="robot-run.gif" alt="robot run" /></div>
      <div class="name">robot-run.gif</div>
      <div class="src">Pixel Robot · David Harrington</div>
    </div>
    <div class="card">
      <div class="frame"><img src="skelly-a.gif" alt="skeleton a" /></div>
      <div class="name">skelly-a.gif</div>
      <div class="src">Skeleton Guy · Disthron</div>
    </div>
    <div class="card">
      <div class="frame"><img src="skelly-b.gif" alt="skeleton b" /></div>
      <div class="name">skelly-b.gif</div>
      <div class="src">Skeleton Guy · Disthron</div>
    </div>
    <div class="card">
      <div class="frame"><img src="cat-kitty.gif" alt="cat kitty" /></div>
      <div class="name">cat-kitty.gif (fallback)</div>
      <div class="src">kitty · kotnaszynce</div>
    </div>
  </div>
</body>
</html>
