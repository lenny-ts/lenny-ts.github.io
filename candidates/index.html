<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>avatar candidates</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #000; color: #cbcbcb; font-family: "Share Tech Mono", monospace; padding: 2rem; }
  h1 { font-size: 1.25rem; margin: 0 0 2rem; color: #ededee; letter-spacing: 0.1em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; }
  .card { text-align: center; }
  .card img { display: block; margin: 0 auto; max-height: 240px; image-rendering: pixelated; background: #0a0a0a; padding: 0.5rem; border: 1px solid #1e1e22; }
  .card .name { margin-top: 0.75rem; font-size: 0.8rem; color: #5a5e64; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <h1>// avatar candidates</h1>
  <div class="grid">
    <div class="card"><img src="cat-netsky.gif" alt="cat-netsky" /><div class="name">cat-netsky.gif</div></div>
    <div class="card"><img src="cat-skel-netsky.gif" alt="cat-skel-netsky" /><div class="name">cat-skel-netsky.gif</div></div>
  </div>
</body>
</html>
