<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="avatar.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:description" content="What are you doing here?" />

  <title>YourName is me!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <style>
    :root {
      --color-void:    #000;
      --color-silver:  #cbcbcb;
      --color-silverhi:#ededee;
      --color-mute:    #8a8d92;
      --color-faint:   #5a5e64;
      --color-line:    #1e1e22;
      --color-redhot:  #ff2323;

      --font-display: "Chakra Petch", system-ui, sans-serif;
      --font-mono:    "Share Tech Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background-color: var(--color-void);
      color: var(--color-mute);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
      gap: 1.5rem;
    }

    /* CRT scanline overlay */
    body::after {
      content: "";
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, #ffffff06 0 1px, #0000 1px 3px);
      position: fixed;
      inset: 0;
    }

    ::selection { background-color: var(--color-redhot); color: #000; }

    /* ---- Avatar ---- */
    .avatar-wrap {
      width: 7rem;
      height: 7rem;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      filter: grayscale(0.25) contrast(1.05);
    }
    .avatar-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--color-line), inset 0 0 24px -8px rgba(255,35,35,0.55);
    }

    /* ---- Headline ---- */
    .headline { text-align: center; }
    .headline h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(2.25rem, 8vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--color-silverhi);
      text-transform: uppercase;
    }
    .headline h1 .blink {
      color: var(--color-redhot);
      animation: blink 1.05s steps(1) infinite;
      margin-left: 0.05em;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .tagline {
      margin-top: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      color: var(--color-faint);
    }
    .tagline::before { content: "> "; color: var(--color-redhot); }

    /* ---- Divider ---- */
    .divider {
      width: 4.5rem;
      height: 2px;
      background: var(--color-line);
      position: relative;
    }
    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -3px;
      transform: translateX(-50%) rotate(45deg);
      width: 6px;
      height: 6px;
      background: var(--color-redhot);
      box-shadow: 0 0 10px rgba(255,35,35,0.7);
    }

    /* ---- Links ---- */
    nav.links {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.625rem;
      width: 100%;
      max-width: 20rem;
    }
    @media (min-width: 40rem) {
      nav.links { flex-direction: row; gap: 0.875rem; max-width: none; }
    }

    .btn {
      --clip: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      padding: 0.75rem 1.25rem;
      clip-path: var(--clip);
      background: rgba(30,30,34,0.4);
      color: var(--color-silver);
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--color-line);
      transition: color .2s, border-color .2s, transform .2s, box-shadow .2s;
      isolation: isolate;
    }
    @media (min-width: 40rem) { .btn { padding: 0.85rem 1.5rem; font-size: 1rem; } }

    .btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      width: 60%;
      left: 0;
      transform: translate(-170%) skew(-20deg);
      background: linear-gradient(105deg,
        transparent 0%,
        rgba(255,35,35,0.22) 42%,
        rgba(255,255,255,0.13) 52%,
        rgba(255,35,35,0.22) 62%,
        transparent 100%);
    }
    .btn:hover, .btn:focus-visible {
      color: var(--color-redhot);
      border-color: var(--color-redhot);
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(255,35,35,0.55), inset 0 0 20px -6px rgba(255,35,35,0.45);
      outline: none;
    }
    .btn:hover::before, .btn:focus-visible::before { animation: scan .62s ease-out; }
    @keyframes scan {
      from { transform: translate(-170%) skew(-20deg); }
      to   { transform: translate(280%) skew(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn:hover::before, .btn:focus-visible::before { animation: none; }
      .headline h1 .blink { animation: none; }
    }

    .btn .ico {
      width: 1.1rem;
      height: 1.1rem;
      flex-shrink: 0;
      fill: currentColor;
    }

    /* ---- Footer line ---- */
    .foot {
      margin-top: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-faint);
      opacity: 0.8;
      text-align: center;
    }
    .foot .dot { color: var(--color-redhot); margin: 0 0.4em; }
  </style>
</head>
<body>

  <header class="headline">
