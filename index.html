  <style>
    :root {
      --color-void:    #000;
      --color-silver:  #cbcbcb;
      --color-silverhi:#ededee;
      --color-mute:    #8a8d92;
      --color-faint:   #5a5e64;
      --color-line:    #1e1e22;
      --color-redhot:  #ff2323;

      --font-display: "Chakra Petch", system-ui, sans-serif;
      --font-mono:    "Share Tech Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background-color: var(--color-void);
      color: var(--color-mute);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* CRT scanline overlay */
    body::after {
      content: "";
      z-index: 9999;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, #ffffff06 0 1px, #0000 1px 3px);
      position: fixed;
      inset: 0;
    }

    ::selection { background-color: var(--color-redhot); color: #000; }

    main {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: 1.5rem 1.25rem;
      user-select: none;
    }
    @media (min-width: 40rem) { main { padding: 2rem 3rem 3rem; } }

    .wrap {
      width: 100%;
      max-width: 20rem;
      text-align: center;
    }
    @media (min-width: 40rem) { .wrap { max-width: 28rem; } }

    /* ---- Avatar (cat-stage with xray skeleton flash) ---- */
    .cat-stage {
      position: relative;
      width: 7rem;
      margin: 0 auto 1rem;
    }
    @media (min-width: 40rem) { .cat-stage { width: 9rem; margin-bottom: 1.5rem; } }
    @media (min-width: 64rem) { .cat-stage { width: 11rem; } }

    .cat-normal, .cat-skel {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
      image-rendering: pixelated;
    }

    .cat-normal {
      position: relative;
      z-index: 1;
      transition: opacity 30ms linear;
    }

    .cat-skel {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      transition: opacity 30ms linear;
    }

    .cat-stage.xray .cat-normal { opacity: 0; }
    .cat-stage.xray .cat-skel { opacity: 1; }

    /* ---- Headline (scramble/decode) ---- */
    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 2.25rem;
      line-height: 1;
      letter-spacing: -0.025em;
      color: var(--color-silverhi);
    }
    @media (min-width: 40rem) { h1 { font-size: 3rem; } }
    @media (min-width: 64rem) { h1 { font-size: 3.75rem; } }

    /* ---- Red separator line ---- */
    .sep {
      display: block;
      height: 2px;
      width: 1.75rem;
      margin: 0.75rem auto;
      background: var(--color-redhot);
      box-shadow: 0 0 12px rgba(255,35,35,0.55);
      border: 0;
    }
    @media (min-width: 40rem) { .sep { height: 3px; width: 2.25rem; margin-block: 1rem; } }

    /* ---- Tagline ---- */
    .tagline {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      color: var(--color-faint);
    }
    @media (min-width: 40rem) { .tagline { font-size: 0.75rem; letter-spacing: 0.3em; } }

    /* ---- Links ---- */
    nav.links {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    @media (min-width: 40rem) { nav.links { margin-top: 2.25rem; gap: 0.875rem; } }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-line);
      color: var(--color-silver);
      font-family: var(--font-display);
      text-decoration: none;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      overflow: hidden;
      isolation: isolate;
      transition: color .2s, border-color .2s, transform .2s, box-shadow .2s;
    }
    @media (min-width: 40rem) {
      .btn { gap: 1rem; padding: 1rem 1.5rem; }
    }

    /* scan sweep on hover */
    .btn::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 60%;
      left: 0;
      transform: translate(-170%) skew(-20deg);
      background: linear-gradient(105deg,
        transparent 0%,
        rgba(255,35,35,0.22) 42%,
        rgba(255,255,255,0.13) 52%,
        rgba(255,35,35,0.22) 62%,
        transparent 100%);
      pointer-events: none;
    }
    .btn:hover, .btn:focus-visible {
      color: var(--color-redhot);
      border-color: var(--color-redhot);
      transform: translateY(-1px);
      box-shadow: inset 0 0 20px -6px rgba(255,35,35,0.45);
      outline: none;
    }
    .btn:hover::before, .btn:focus-visible::before { animation: scan .62s ease-out; }
    @keyframes scan {
      from { transform: translate(-170%) skew(-20deg); }
      to   { transform: translate(280%) skew(-20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn:hover::before, .btn:focus-visible::before { animation: none; }
    }

    .btn .ico {
      position: relative;
      z-index: 1;
      width: 1.25rem;
      height: 1.25rem;
      flex-shrink: 0;
      fill: currentColor;
      opacity: 0.9;
    }
    @media (min-width: 40rem) { .btn .ico { width: 1.5rem; height: 1.5rem; } }

    .btn .label {
      position: relative;
      z-index: 1;
      flex: 1;
      text-align: left;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 1rem;
      letter-spacing: 0.025em;
    }
    @media (min-width: 40rem) { .btn .label { font-size: 1.125rem; } }

    .btn .arrow {
      position: relative;
      z-index: 1;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--color-faint);
      transition: color .2s, transform .2s;
    }
    @media (min-width: 40rem) { .btn .arrow { font-size: 1rem; } }
    .btn:hover .arrow, .btn:focus-visible .arrow {
      color: var(--color-redhot);
      transform: translate(0.2rem, -0.2rem);
    }
  </style>

  <script>
  (function () {
    "use strict";
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ---- Scramble / decode effect on headline ---- */
    var CHARSET = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&/<>*+=-";
    function randChar() { return CHARSET[(Math.random() * CHARSET.length) | 0]; }
    function scramble(text, revealed) {
      var out = "";
      for (var i = 0; i < text.length; i++) {
        out += i < revealed ? text[i] : text[i] === " " ? " " : randChar();
      }
      return out;
    }
    function decode(el, text, duration) {
      var start = performance.now();
      function tick(now) {
        var p = Math.min(1, (now - start) / duration);
        el.textContent = scramble(text, Math.floor(p * text.length));
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = text;
      }
      el.textContent = scramble(text, 0);
      requestAnimationFrame(tick);
    }

    var h1 = document.getElementById("headline");
    if (h1 && !reduce) {
      decode(h1, h1.textContent, 1600);
    }

    /* ---- X-ray skeleton flash on cat ---- */
    var stage = document.getElementById("catStage");
    if (stage && !reduce) {
      var timers = [];
      function after(fn, ms) {
        var id = setTimeout(fn, ms);
        timers.push(id);
      }
      function setXray(on) { stage.classList.toggle("xray", on); }
      function flash(on, done) {
        setXray(on);
        after(function () { setXray(!on); }, 45);
        after(function () { setXray(on); }, 95);
        after(done, 150);
      }
      function cycle() {
        after(function () {
          flash(true, function () {
            after(function () {
              flash(false, function () { cycle(); });
            }, 1150);
          });
        }, 4800);
      }
      cycle();
    }
  })();
  </script>
